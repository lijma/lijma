# 码文说 博客配置
title: 码文说
description: 做到比想到重要，让别人看到更重要
url: "https://lijma.github.io"
baseurl: "/lijma"

# 主题配置
theme: just-the-docs
color_scheme: light

# Logo 和品牌（暂时禁用 logo，使用文字标题）
# logo: "/assets/images/logo.png"

# 搜索配置
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  focus_shortcut_key: 'k'

# 导航配置
nav_enabled: true
heading_anchors: true

# 辅助链接
aux_links:
  "GitHub":
    - "https://github.com/lijma"
aux_links_new_tab: true

# 页脚配置
footer_content: "Copyright &copy; 2024-2026 Marvin Ma. Built with <a href=\"https://github.com/just-the-docs/just-the-docs\">Just the Docs</a>."
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"

# GitHub 编辑链接
gh_edit_link: true
gh_edit_link_text: "在 GitHub 上编辑此页"
gh_edit_repository: "https://github.com/lijma/lijma"
gh_edit_branch: "main"

# Back to top
back_to_top: true
back_to_top_text: "返回顶部"

# Mermaid 图表支持
mermaid:
  version: "10.1.0"

# 站点语言
lang: zh-CN

# 排除文件
exclude:
  - node_modules/
  - vendor/
  - .git/
  - .github/
  - Gemfile.lock
