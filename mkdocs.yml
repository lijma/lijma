site_name: 码文说
site_description: 理解问题 → 打造技能 → 让技能在 AI 时代被看到
site_author: Marvin Ma
site_url: https://lijma.github.io/lijma/
repo_url: https://github.com/lijma/lijma
repo_name: lijma/lijma
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: black
      accent: black
  features:
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - fgeo: https://github.com/lijma/fgeo
  - floop: https://github.com/lijma/floop-server
  - fdesign: https://github.com/lijma/fdesign
  - fcontext: https://github.com/lijma/fcontext
  - testboat: https://lijma.github.io/testboat/
  - Jimmer in action: https://lijma.github.io/jimmer-in-action/
  - 关于: about.md
  - 随想: https://lijma.github.io/lives/

extra:
  analytics:
    provider: google
    property: G-WC9TQK6KRV
  social:
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/marvintalk.bsky.social
      name: Bluesky @marvintalk
    - icon: fontawesome/solid/rss
      link: /lijma/feed_rss_created.xml
      name: RSS 订阅

copyright: '<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2021030689号</a>'

extra_css:
  - stylesheets/codinghorror.css

extra_javascript:
  - javascripts/giscus.js
  - javascripts/share.js

markdown_extensions:
  - def_list
  - attr_list
  - md_in_html

plugins:
  - search
  - blog:
      blog_dir: .
      post_date_format: yyyy年M月d日
      archive: true
      archive_date_format: yyyy年
      categories: true
      post_excerpt: optional
  - rss:
      match_path: "posts/.*"
      date_from_meta:
        as_creation: date
        datetime_format: "%Y-%m-%d"

markdown_extensions:
  - meta
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - def_list
  - tables
